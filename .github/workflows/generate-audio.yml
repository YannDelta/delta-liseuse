name: Générer les narrations

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/generate-audio.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Démarrer Kokoro
        run: |
          docker pull ghcr.io/remsky/kokoro-fastapi-cpu:latest
          docker run -d --name kokoro -p 8880:8880 \
            -e API_LOG_LEVEL=WARNING \
            ghcr.io/remsky/kokoro-fastapi-cpu:latest
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8880/health >/dev/null; then
              echo "Kokoro prêt"
              exit 0
            fi
            sleep 3
          done
          docker logs kokoro
          exit 1

      - name: Extraire le texte des 48 planches
        run: |
          mkdir -p .tts-text audio
          node <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('data.js', 'utf8');
          const match = source.match(/window\.DELTA_PAGES\s*=\s*(\[[\s\S]*?\]);\s*for\(const page/);
          if (!match) throw new Error('DELTA_PAGES introuvable');
          const pages = JSON.parse(match[1]);
          if (!Array.isArray(pages) || !pages.length) throw new Error('DELTA_PAGES vide');
          for (const p of pages) {
            const n = String(p.number).padStart(2, '0');
            const text = (p.paragraphs || []).join('\n\n');
            fs.writeFileSync(`.tts-text/P${n}.txt`, text, 'utf8');
          }
          console.log(`${pages.length} textes extraits`);
          NODE

      - name: Générer les MP3 avec Kokoro
        run: |
          for txt in .tts-text/P*.txt; do
            base="$(basename "$txt" .txt)"
            jq -n --rawfile input "$txt" '{
              model:"kokoro",
              input:$input,
              voice:"ff_siwis",
              response_format:"mp3",
              speed:0.92,
              stream:false
            }' > .tts-text/request.json
            curl -fsS -X POST http://127.0.0.1:8880/v1/audio/speech \
              -H "Content-Type: application/json" \
              --data-binary @.tts-text/request.json \
              --output "audio/$base.mp3"
            test -s "audio/$base.mp3"
            echo "$base générée"
          done
          ls -lh audio | head

      - name: Publier les narrations
        run: |
          rm -rf .tts-text
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio
          if git diff --cached --quiet; then
            echo "Aucun changement audio."
          else
            git commit -m "Régénère les narrations avec Kokoro ff_siwis"
            git push
          fi

name: Générer les narrations

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/generate-audio.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Préparer les moteurs audio
        run: |
          docker pull ghcr.io/openvoiceos/ovos-tts-plugin-espeakng:dev
          docker pull jrottenberg/ffmpeg:7.1-alpine

      - name: Extraire le texte des 48 planches
        run: |
          mkdir -p .tts-text audio
          node <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('data.js', 'utf8');
          const match = source.match(/window\.DELTA_PAGES\s*=\s*(\[[\s\S]*?\]);\s*for\(const page/);
          if (!match) throw new Error('DELTA_PAGES introuvable');
          const pages = JSON.parse(match[1]);
          if (!Array.isArray(pages) || !pages.length) throw new Error('DELTA_PAGES vide');
          for (const p of pages) {
            const n = String(p.number).padStart(2, '0');
            const text = (p.paragraphs || []).join('\n\n');
            fs.writeFileSync(`.tts-text/P${n}.txt`, text, 'utf8');
          }
          console.log(`${pages.length} textes extraits`);
          NODE

      - name: Générer les MP3
        run: |
          uid="$(id -u)"
          gid="$(id -g)"
          for txt in .tts-text/P*.txt; do
            base="$(basename "$txt" .txt)"
            docker run --rm --user "$uid:$gid" -v "$PWD:/work" --entrypoint espeak-ng               ghcr.io/openvoiceos/ovos-tts-plugin-espeakng:dev               -v fr -s 145 -f "/work/$txt" -w "/work/.tts-text/$base.wav"
            docker run --rm --user "$uid:$gid" -v "$PWD:/work"               jrottenberg/ffmpeg:7.1-alpine               -loglevel error -y -i "/work/.tts-text/$base.wav"               -codec:a libmp3lame -qscale:a 6 "/work/audio/$base.mp3"
            rm -f ".tts-text/$base.wav"
          done
          ls -lh audio | head

      - name: Publier les narrations
        run: |
          rm -rf .tts-text
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio
          if git diff --cached --quiet; then
            echo "Aucun changement audio."
          else
            git commit -m "Génère les narrations audio des planches"
            git push
          fi
